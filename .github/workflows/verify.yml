name: Reusable verify

# Reusable CI every repo calls, on pull requests and on pushes to main.
# format:check / check / test / build run on every repo — not toggleable; a
# missing script fails CI by design. Branch-protection context is
# "verify / verify". Bot PRs auto-merge on green, so this is the gate between an
# update and production: on main, deploy jobs should `needs:` this workflow.

on:
  workflow_call:
    inputs:
      node_version:
        description: "Node.js for tools with node shebangs (astro, vue-tsc). Match your deploy workflow."
        type: string
        required: false
        default: "24"
      dependency_review:
        description: "Run dependency-review on PRs (public repos only; set by bootstrap)."
        type: boolean
        default: false
      extra_scripts:
        description: "Extra `bun run <name>` scripts, run on top of the standard set."
        type: string
        required: false
        default: ""
      build_env:
        description: >-
          Non-secret KEY=VALUE lines exported for the install, build and test
          steps (e.g. placeholder VITE_* values a bundler needs at build
          time). Visible in logs: never put secrets here.
        type: string
        required: false
        default: ""
      output_dir:
        description: >-
          The build output that gets deployed (scanned for secrets after the
          build). Default dist/, which Astro and Vite use.
        type: string
        required: false
        default: "dist"

# Permissions inherit from the caller. Callers grant issues: write so a failure
# on main opens an alert issue; public callers also grant pull-requests: write
# for the dependency-review comment.

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Gate Bun steps on a package.json (a project-less repo stays green) and
      # the image build on a root Dockerfile.
      - id: detect
        run: |
          echo "project=${{ hashFiles('package.json') != '' }}" >> "$GITHUB_OUTPUT"
          echo "docker=${{ hashFiles('Dockerfile') != '' }}" >> "$GITHUB_OUTPUT"

      # Steps below that run our own commands source this first, so a failure
      # can be reported with its step name and output (a later step can't read
      # an earlier step's log through the API while the job is still running).
      # It records the step as running and tees its output to a file; on success
      # the marker is removed, so after a failure it names the step that failed.
      - name: Prepare step logs
        run: |
          cat >"$RUNNER_TEMP/verify-step.sh" <<'EOF'
          # Usage (top of a step): . "$RUNNER_TEMP/verify-step.sh" "<step name>"
          VERIFY_STEP_DIR="$RUNNER_TEMP/verify-step"
          mkdir -p "$VERIFY_STEP_DIR"
          printf '%s\n' "$1" >"$VERIFY_STEP_DIR/name"
          exec 3>&1 4>&2
          exec > >(tee "$VERIFY_STEP_DIR/log") 2>&1
          verify_tee_pid=$!
          verify_step_done() {
            local rc=$?
            # Restore the real stdout/stderr so tee sees EOF, then let it flush.
            exec 1>&3 2>&4 3>&- 4>&-
            wait "$verify_tee_pid" 2>/dev/null || true
            if [ "$rc" = 0 ]; then rm -f "$VERIFY_STEP_DIR/name"; fi
            exit "$rc"
          }
          trap verify_step_done EXIT
          EOF

          # Prints a Markdown summary of the failed step for comments/issues.
          cat >"$RUNNER_TEMP/verify-failure.sh" <<'EOF'
          dir="$RUNNER_TEMP/verify-step"
          if [ -f "$dir/name" ]; then
            printf '**Failed step:** %s\n' "$(cat "$dir/name")"
            # Last 40 lines, colour codes and log-group markers stripped, long
            # lines cut, and backtick runs shortened so nothing escapes the
            # code fence (inside it, @mentions and Markdown stay inert).
            # shellcheck disable=SC2016 # literal backticks (Markdown), not expansions
            excerpt="$(sed -E 's/\x1b\[[0-9;?]*[A-Za-z]//g; /^::(group|endgroup)::/d; s/`{3,}/``/g' "$dir/log" |
              cut -c1-300 | tail -n 40)"
            if [ -n "$excerpt" ]; then
              # shellcheck disable=SC2016
              printf '\n<details open><summary>Last lines of output</summary>\n\n```text\n%s\n```\n\n</details>\n' "$excerpt"
            fi
          else
            printf '**Failed step:** a step without captured output (checkout, Node/Bun setup, cache or dependency review); see the run.\n'
          fi
          EOF

      - name: Dependency review
        if: ${{ inputs.dependency_review && github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

      # package.json "packageManager" is the repo's single Bun version: setup-bun
      # reads it, and so do deploy workflows. Fail fast if any other pin in the
      # repo disagrees, so CI, deploy, Docker and local dev can't drift apart.
      - name: Check Bun pins agree
        if: ${{ fromJSON(steps.detect.outputs.project) }}
        run: |
          . "$RUNNER_TEMP/verify-step.sh" "Check Bun pins agree"
          pm="$(jq -r '.packageManager // ""' package.json)"
          case "$pm" in
            bun@*) want="${pm#bun@}"; want="${want%%+*}" ;;
            *) echo "::error file=package.json::packageManager must be \"bun@<version>\" (got \"$pm\")"; exit 1 ;;
          esac
          fail=0
          if [ -f .bun-version ]; then
            have="$(tr -d '[:space:]' < .bun-version)"
            if [ "$have" != "$want" ]; then
              echo "::error file=.bun-version::.bun-version is $have but packageManager is bun@$want"
              fail=1
            fi
          fi
          while IFS= read -r f; do
            while IFS= read -r tag; do
              if [ "$tag" != "$want" ]; then
                echo "::error file=$f::$f uses oven/bun:$tag but packageManager is bun@$want"
                fail=1
              fi
            done < <(grep -oE 'oven/bun:[0-9]+\.[0-9]+\.[0-9]+' "$f" | cut -d: -f2)
          done < <(git ls-files -- 'Dockerfile' '*/Dockerfile' 'Dockerfile.*' '*.Dockerfile')
          [ "$fail" = 0 ] && echo "Bun pins agree: $want"
          exit "$fail"

      - name: Setup Node
        if: ${{ fromJSON(steps.detect.outputs.project) }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}

      - name: Setup Bun
        if: ${{ fromJSON(steps.detect.outputs.project) }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        # No bun-version: setup-bun reads package.json "packageManager".

      - name: Cache Bun install cache
        if: ${{ fromJSON(steps.detect.outputs.project) }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Build-time values from the caller (validated: one KEY=VALUE per line,
      # shell-style uppercase keys, nothing that changes how tools run).
      - name: Build env
        if: ${{ inputs.build_env != '' }}
        env:
          BUILD_ENV: ${{ inputs.build_env }}
        run: |
          . "$RUNNER_TEMP/verify-step.sh" "Build env"
          while IFS= read -r line; do
            line="${line%$'\r'}"
            case "$line" in "" | "#"*) continue ;; esac
            key="${line%%=*}"
            if [ "$key" = "$line" ] || ! [[ "$key" =~ ^[A-Z_][A-Z0-9_]*$ ]]; then
              echo "::error::build_env: expected KEY=VALUE, got '$key...'"
              exit 1
            fi
            case "$key" in
              PATH | HOME | NODE_OPTIONS | LD_* | DYLD_* | BASH_ENV | ENV | GITHUB_* | RUNNER_* | ACTIONS_*)
                echo "::error::build_env: $key can't be set here"
                exit 1
                ;;
            esac
            echo "$line" >> "$GITHUB_ENV"
            echo "set $key"
          done <<<"$BUILD_ENV"

      # Every committed bun.lock (e.g. a CDK app in infra/), not just the root:
      # a lockfile Bun rejects must fail here, not after merge.
      - name: Install
        if: ${{ fromJSON(steps.detect.outputs.project) }}
        run: |
          . "$RUNNER_TEMP/verify-step.sh" "Install"
          git ls-files -- 'bun.lock' '*/bun.lock' | while IFS= read -r lock; do
            dir="$(dirname "$lock")"
            echo "::group::bun install --frozen-lockfile ($dir)"
            (cd "$dir" && bun install --frozen-lockfile)
            echo "::endgroup::"
          done

      # Repo-specific extras, before the standard set.
      - name: Extra scripts
        if: ${{ fromJSON(steps.detect.outputs.project) && inputs.extra_scripts != '' }}
        env:
          EXTRA_SCRIPTS: ${{ inputs.extra_scripts }}
        run: |
          . "$RUNNER_TEMP/verify-step.sh" "Extra scripts"
          for s in $EXTRA_SCRIPTS; do
            echo "::group::bun run $s"
            bun run "$s"
            echo "::endgroup::"
          done

      # Standard set — runs on every repo.
      - name: Format check
        if: ${{ fromJSON(steps.detect.outputs.project) }}
        run: |
          . "$RUNNER_TEMP/verify-step.sh" "Format check"
          bun run format:check

      - name: Typecheck
        if: ${{ fromJSON(steps.detect.outputs.project) }}
        run: |
          . "$RUNNER_TEMP/verify-step.sh" "Typecheck"
          bun run check

      # Build runs before Test so tests can check the built output (e.g. smoke
      # tests over dist/); unit tests don't care about the order.
      - name: Build
        if: ${{ fromJSON(steps.detect.outputs.project) }}
        run: |
          . "$RUNNER_TEMP/verify-step.sh" "Build"
          bun run build

      # The deploy uploads the build output, not the repo, so scan exactly that.
      # GitHub secret scanning only sees what's committed (and only on public
      # repos here); a key baked into a bundle at build time (a VITE_/PUBLIC_
      # variable, a stray file in public/) never touches git. Deploy jobs need
      # verify, so a hit here keeps it off the live site.
      - name: Scan build output for secrets
        if: ${{ fromJSON(steps.detect.outputs.project) }}
        env:
          OUTPUT_DIR: ${{ inputs.output_dir }}
          # Pinned and checksum-verified; bump both together from
          # https://github.com/gitleaks/gitleaks/releases (checksums.txt).
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          . "$RUNNER_TEMP/verify-step.sh" "Scan build output for secrets"
          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "::error::$OUTPUT_DIR/ doesn't exist after the build; set verify's output_dir input to the deployed directory"
            exit 1
          fi
          # Files that should never be published, whatever they contain.
          bad="$(find "$OUTPUT_DIR" \( -name '.env' -o -name '.env.*' -o -name '.dev.vars*' \
            -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o -name 'id_rsa*' \
            -o -name 'id_ed25519*' -o -name '.npmrc' -o -name 'credentials*' -o -name 'cdk-outputs.json' \
            -o -path '*/.git/*' -o -name '.git' \) -print)"
          if [ -n "$bad" ]; then
            printf '::error::Secret-looking files in %s/ would be deployed:\n%s\n' "$OUTPUT_DIR" "$bad"
            exit 1
          fi
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL --retry 4 --retry-all-errors -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum -c --quiet -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          # Redacted output: file and rule, never the value. False positives go
          # in a .gitleaksignore (one finding fingerprint per line) at the repo root.
          "$RUNNER_TEMP/gitleaks" dir "$OUTPUT_DIR" --redact --no-banner --verbose --exit-code 1

      - name: Test
        if: ${{ fromJSON(steps.detect.outputs.project) }}
        run: |
          . "$RUNNER_TEMP/verify-step.sh" "Test"
          bun run test

      # A repo that ships an image gets it built (not pushed) on every PR, so an
      # update that breaks the image fails here rather than in the publish job.
      - name: Build Docker image
        if: ${{ fromJSON(steps.detect.outputs.docker) }}
        run: |
          . "$RUNNER_TEMP/verify-step.sh" "Build Docker image"
          docker build --pull --tag "verify:$GITHUB_SHA" .

      # Merges to main are mostly bots now, and GitHub only emails the actor
      # about failed runs — so open (or update) an issue assigned to the owner.
      - name: Alert on failure (main)
        if: ${{ failure() && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          gh label create ci-failure --color B60205 \
            --description "verify is failing on the default branch" --force >/dev/null
          summary="$(bash "$RUNNER_TEMP/verify-failure.sh")"
          open="$(gh issue list --label ci-failure --state open --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Still failing at $GITHUB_SHA: $RUN_URL

          $summary"
          else
            gh issue create --label ci-failure --assignee "$GITHUB_REPOSITORY_OWNER" \
              --title "verify failing on $BRANCH" \
              --body "verify failed on \`$BRANCH\` at $GITHUB_SHA, so deploys are paused and every open PR's CI will fail until it's fixed.

          Run: $RUN_URL

          $summary

          This issue closes itself when verify passes on \`$BRANCH\` again."
          fi

      - name: Close alert on recovery (main)
        if: ${{ success() && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --label ci-failure --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "verify is passing again at $GITHUB_SHA: $RUN_URL"
          done

      # A bot PR that fails verify just sits open: it won't auto-merge, and
      # GitHub only emails the actor about failed runs. One comment that
      # @mentions the owner sends a single email that already says what broke.
      # Later failures edit that comment instead of posting again (edits don't
      # email), and a later green run marks it resolved. Green bot PRs that
      # never failed stay silent.
      - name: Report failed bot PR to the owner
        if: >-
          ${{ failure() && github.event_name == 'pull_request' &&
          contains(fromJSON('["dependabot[bot]", "renovate[bot]"]'), github.event.pull_request.user.login) }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- salt-mountain/ops verify -->'
          body="$RUNNER_TEMP/verify-comment.md"
          {
            printf '%s\n' "$marker"
            printf '@%s verify failed on this PR, so it will not auto-merge.\n\n' "$GITHUB_REPOSITORY_OWNER"
            printf '**Commit:** %s\n**Run:** %s\n\n' "$HEAD_SHA" "$RUN_URL"
            bash "$RUNNER_TEMP/verify-failure.sh"
          } >"$body"
          id="$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)"
          if [ -n "$id" ]; then
            gh api --silent -X PATCH "repos/$GH_REPO/issues/comments/$id" -F "body=@$body"
            echo "Updated comment $id on #$PR_NUMBER"
          else
            gh api --silent -X POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" -F "body=@$body"
            echo "Commented on #$PR_NUMBER"
          fi

      - name: Mark bot PR failure resolved
        if: >-
          ${{ success() && github.event_name == 'pull_request' &&
          contains(fromJSON('["dependabot[bot]", "renovate[bot]"]'), github.event.pull_request.user.login) }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- salt-mountain/ops verify -->'
          id="$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)"
          if [ -n "$id" ]; then
            printf '%s\nverify passed again at %s: %s\n' "$marker" "$HEAD_SHA" "$RUN_URL" >"$RUNNER_TEMP/verify-comment.md"
            gh api --silent -X PATCH "repos/$GH_REPO/issues/comments/$id" -F "body=@$RUNNER_TEMP/verify-comment.md"
            echo "Marked comment $id resolved"
          fi
